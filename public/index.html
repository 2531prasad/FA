<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Financial research, with its sources, disagreements and revision history intact.">
<title>FA — Research workspace</title>
<link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./styles.css">
<script src="./vendor/marked.umd.js" defer></script><script src="./research.js" defer></script><script src="./minimap.js" defer></script><script src="./workspace-client.js" defer></script><script src="./app.js" defer></script>
</head>
<body>
<a class="skip skip-link" href="#main">Skip to report</a>
<header class="masthead">
<a href="#/library" class="brand" aria-label="Browse FA reports">FA<span class="brand-square"></span></a>
<span class="mast-title">FINANCIAL ANALYSIS</span>
<div class="panel-controls">
<span id="connection" class="sync-badge pane-toggle" role="status">Local files</span>
<button id="research-launch" class="button primary compact research-launch" aria-haspopup="dialog">Research</button>
<a id="workspace-tools" class="pane-toggle" href="./classic.html" title="Git synchronization, bulk imports and date editing">Workspace tools ↗</a><button id="import-report" class="pane-toggle" title="Import Markdown"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span>Import</span></button>
<button id="toggle-library" class="pane-toggle" data-panel="left" aria-controls="library-sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><path d="M9 4v16"/></svg><span>Library</span></button>
<button id="toggle-context" class="pane-toggle" data-panel="right" aria-controls="report-context" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><path d="M15 4v16"/></svg><span>Context</span></button>
<button id="focus-reading" class="pane-toggle" aria-pressed="false" title="Focus on the report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>Focus</span></button>
<button id="theme-toggle" class="pane-toggle" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
</div>
</header>
<div class="app-shell">
<aside id="library-sidebar" class="sidebar" aria-label="Report library">
<div class="sidebar-heading"><h2>Research library <span id="company-count" class="mono"></span></h2><button class="pane-hide" data-panel="left" aria-label="Hide library">‹</button></div>
<label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><input id="search" type="search" placeholder="Find research or a report" aria-label="Find a query, company, or report"></label>
<div class="search-options"><label><input id="search-bodies" type="checkbox"> Search report bodies</label><label><input id="search-history" type="checkbox"> Include historical revisions</label><span id="search-status" role="status"></span></div>
<nav id="library" tabindex="0" aria-label="Research queries and reports"></nav>
<div class="sidebar-tools"><a href="#/library" id="nav-library" class="text-button">Browse reports</a><a href="#/activity" id="nav-activity" class="text-button">Workspace timeline</a><button id="terminal-help" class="text-button">Agent handoff & instructions</button></div>
</aside>
<main id="main" tabindex="-1"><div id="workspace"><div class="loading">Opening your research workspace…</div></div></main>
<div id="document-map" class="document-map" role="scrollbar" aria-label="Page minimap; drag or use arrow and page keys to scroll" aria-controls="main" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0" hidden><canvas id="document-map-canvas" aria-hidden="true"></canvas><span id="document-map-thumb" class="document-map-thumb" aria-hidden="true"></span></div>
<aside id="report-context" class="context" aria-label="Report context"><div class="context-heading"><h2>Report context</h2><button class="pane-hide" data-panel="right" aria-label="Hide report context">›</button></div><div id="context-content" tabindex="0" aria-label="Scrollable report context"><nav id="outline" class="section-nav" aria-label="Report sections"></nav><div id="context-facts"></div></div></aside>
</div>
<footer class="app-footer"><span id="footer-status">Local files · Revision history preserved</span><span>Times: Asia/Kolkata (IST)</span></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></dialog>
</body>
</html>
