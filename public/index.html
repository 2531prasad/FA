<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local workspace for financial research that improves with every revision.">
  <title>FA — Research workspace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23f4f4f0'/%3E%3Ctext x='4' y='28' font-size='25' font-family='Arial' font-weight='900'%3EFA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to report</a>
  <header class="masthead"><a href="/" class="brand" aria-label="FA workspace">FA<span class="brand-square"></span></a><span class="mast-title">FINANCIAL ANALYSIS</span><div class="panel-controls"><button id="toggle-library" class="pane-toggle" data-action="toggle-panel" data-panel="left" aria-controls="library-sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"></rect><path d="M9 4v16"></path></svg><span>Library</span></button><button id="toggle-context" class="pane-toggle" data-action="toggle-panel" data-panel="right" aria-controls="report-context" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"></rect><path d="M15 4v16"></path></svg><span>Context</span></button></div><button id="import-report" class="button compact">Import Markdown</button></header>
  <div class="app-shell">
    <aside id="library-sidebar" class="sidebar" aria-label="Report library">
      <div class="sidebar-heading"><h2>Research library <span id="company-count" class="mono"></span></h2><button class="pane-hide" data-action="toggle-panel" data-panel="left" aria-label="Hide library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"></path></svg></button></div>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 6 6"></path></svg><input id="search" type="search" placeholder="Find research or a report" aria-label="Find a query, company, or report"></label>
      <nav id="library" tabindex="0" aria-label="Research queries, companies, and reports"></nav>
      <div class="sidebar-tools"><button id="terminal-help" class="text-button">Agent handoff & instructions</button></div>
    </aside>
    <main id="main" tabindex="-1"><div id="notice" role="status" aria-live="polite"></div><div id="workspace"><div class="loading">Opening your research workspace…</div></div></main>
    <aside id="report-context" class="context" aria-label="Report context"><div class="context-heading"><h2 id="context-title">Report context</h2><button class="pane-hide" data-action="toggle-panel" data-panel="right" aria-label="Hide report context"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"></path></svg></button></div><div id="context-content" tabindex="0" aria-label="Scrollable report context"></div></aside>
  </div>
  <footer class="app-footer"><span id="footer-status">Local files</span><span>Times: Asia/Kolkata (IST)</span></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></dialog>
</body>
</html>
